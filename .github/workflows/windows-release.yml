name: Windows Ultimate Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Windows package version"
        required: true
        default: "1.0.0"
  push:
    branches:
      - "main"
    tags:
      - "windows-v*"

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-2025
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm

      - name: Install dependencies and run tests
        shell: pwsh
        run: |
          npm ci --ignore-scripts
          npm test
          npm run audit

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress --yes

      - name: Validate PowerShell entry points
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem .\windows -Filter *.ps1) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors) { throw "PowerShell parse failed: $($file.Name)" }
          }
          & .\windows\install-ultimate.ps1 -DryRun
          $guideCount = @(Get-ChildItem .\windows -Filter "README*.md" -File).Count
          if ($guideCount -ne 12) { throw "Expected 12 Windows language guides, found $guideCount." }

      - name: Reproduce and audit Windows profile
        shell: pwsh
        run: |
          $env:DSH_HOME = Join-Path $env:RUNNER_TEMP "dsh-home"
          $profile = Join-Path $env:DSH_HOME "profiles\ultimate"
          & .\windows\install-ultimate.ps1 -ProfileDir $profile
          node .\scripts\audit-installed-profile.mjs --profile-dir $profile
          $components = Get-Content (Join-Path $profile "COMPONENTS.json") -Raw | ConvertFrom-Json
          if ($components.package -contains "keyringseam") {
            throw "Windows profile unexpectedly contains macOS-only keyringseam."
          }
          $config = npx --yes @deepseek-ai/dsh@0.1.0-rc.7 --profile ultimate --dump-default-config
          if ($LASTEXITCODE -ne 0) { throw "The generated Ultimate profile could not be composed by DSH." }
          $configText = $config -join "`n"
          if ($configText -notmatch '@deepseek-ai/dsh-base' -or $configText -notmatch '@deepseek-ai/dsh-web-app') {
            throw "The generated Ultimate profile is missing the official base or Web app layer."
          }

      - name: Build Windows packages
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          $version = if ($env:INPUT_VERSION) { $env:INPUT_VERSION } elseif ($env:TAG_VERSION -match '^windows-v(.+)$') { $Matches[1] } else { '1.0.0' }
          & .\windows\build-release.ps1 -Version $version -OutputDirectory .\releases

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-ultimate-windows-x64
          path: releases/*

      - name: Publish GitHub release for a Windows tag
        if: startsWith(github.ref, 'refs/tags/windows-v')
        uses: softprops/action-gh-release@v2
        with:
          files: releases/*
