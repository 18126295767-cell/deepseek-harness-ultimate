name: Windows Ultimate Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Windows package version"
        required: true
        default: "1.0.0"
  push:
    branches:
      - "main"
    tags:
      - "windows-v*"

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-2025
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - name: Install dependencies and run tests
        shell: pwsh
        run: |
          npm ci --ignore-scripts
          npm run audit

      - name: Install screenshot runtime
        shell: pwsh
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress --yes

      - name: Validate PowerShell entry points
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem .\windows -Filter *.ps1) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors) { throw "PowerShell parse failed: $($file.Name)" }
          }
          & .\windows\install-ultimate.ps1 -DryRun
          $guideCount = @(Get-ChildItem .\windows -Filter "README*.md" -File).Count
          if ($guideCount -ne 12) { throw "Expected 12 Windows language guides, found $guideCount." }

      - name: Reproduce and audit Windows profile
        timeout-minutes: 8
        shell: pwsh
        run: |
          $env:DSH_HOME = Join-Path $env:RUNNER_TEMP "dsh-home"
          $profile = Join-Path $env:DSH_HOME "profiles\ultimate"
          & .\windows\install-ultimate.ps1 -ProfileDir $profile
          node .\scripts\audit-installed-profile.mjs --profile-dir $profile
          $components = Get-Content (Join-Path $profile "COMPONENTS.json") -Raw | ConvertFrom-Json
          if ($components.package -contains "keyringseam") {
            throw "Windows profile unexpectedly contains macOS-only keyringseam."
          }
          $stdout = Join-Path $env:RUNNER_TEMP "ultimate-web.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "ultimate-web.stderr.log"
          $runtime = Join-Path $env:RUNNER_TEMP "dsh-runtime"
          New-Item -ItemType Directory -Force -Path $runtime | Out-Null
          Push-Location $runtime
          try {
            npm init -y | Out-Host
            pnpm add --save-exact --ignore-scripts @deepseek-ai/dsh@0.1.0-rc.7 | Out-Host
          } finally {
            Pop-Location
          }
          $dshBin = Join-Path $runtime "node_modules\@deepseek-ai\dsh\lib\bin.js"
          $config = & node.exe $dshBin --profile ultimate --dump-default-config
          if ($LASTEXITCODE -ne 0) { throw "The generated Ultimate profile could not be composed by DSH." }
          $configText = $config -join "`n"
          if ($configText -notmatch '@deepseek-ai/dsh-base' -or $configText -notmatch '@deepseek-ai/dsh-web-app') {
            throw "The generated Ultimate profile is missing the official base or Web app layer."
          }
          $server = Start-Process -FilePath "node.exe" -ArgumentList @(
            $dshBin, "--profile", "ultimate", "--port", "3080"
          ) -WorkingDirectory $runtime -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          try {
            $response = $null
            $deadline = [DateTime]::UtcNow.AddSeconds(120)
            while ([DateTime]::UtcNow -lt $deadline) {
              $server.Refresh()
              if ($server.HasExited) { throw "Ultimate Web runtime exited before it became ready." }
              try {
                $response = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:3080/" -TimeoutSec 2
                if ($response.StatusCode -eq 200) { break }
              } catch {
                Start-Sleep -Milliseconds 500
              }
            }
            if ($null -eq $response -or $response.StatusCode -ne 200) {
              throw "Ultimate Web runtime did not return HTTP 200 within 120 seconds."
            }
            node .\scripts\capture-windows-ui.mjs --url "http://127.0.0.1:3080/" --output .\windows-screenshots

            $proof = Get-Content .\windows-screenshots\windows-screenshot-proof.json -Raw | ConvertFrom-Json
            if ($proof.platform -ne "win32") { throw "Screenshot proof did not report Windows." }
            if ($proof.runnerImage -ne "windows2025") { throw "Unexpected runner image: $($proof.runnerImage)" }
            if ($proof.screenshots.Count -ne 5) { throw "Expected five Windows screenshots." }
            foreach ($screenshot in $proof.screenshots) {
              if ($screenshot.width -ne 1600 -or $screenshot.height -ne 1000) {
                throw "Unexpected dimensions for $($screenshot.file)."
              }
              if ($screenshot.sha256 -notmatch '^[a-f0-9]{64}$') {
                throw "Invalid SHA-256 for $($screenshot.file)."
              }
            }
          } finally {
            $server.Refresh()
            if (-not $server.HasExited) { & taskkill.exe /PID $server.Id /T /F | Out-Host }
            if (Test-Path $stdout) { Get-Content $stdout }
            if (Test-Path $stderr) { Get-Content $stderr }
          }

      - name: Run repository tests with generated screenshot evidence
        shell: pwsh
        run: |
          Copy-Item .\windows-screenshots\windows-*.png .\assets\screenshots\ -Force
          npm test

      - name: Build Windows packages
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          $version = if ($env:INPUT_VERSION) { $env:INPUT_VERSION } elseif ($env:TAG_VERSION -match '^windows-v(.+)$') { $Matches[1] } else { '1.0.0' }
          & .\windows\build-release.ps1 -Version $version -OutputDirectory .\releases

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-ultimate-windows-x64
          path: releases/*

      - name: Upload Windows screenshot evidence
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-ultimate-windows-screenshots
          path: windows-screenshots/*
          if-no-files-found: error

      - name: Publish GitHub release for a Windows tag
        if: startsWith(github.ref, 'refs/tags/windows-v')
        uses: softprops/action-gh-release@v2
        with:
          files: releases/*
